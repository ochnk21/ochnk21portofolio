<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAUZAN | GUESTBOOK LOGS</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .guestbook-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #00f3ff;
            letter-spacing: 1px;
        }

        .input-group input, 
        .input-group textarea {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00f3ff;
            border-radius: 5px;
            padding: 10px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .btn-submit {
            background: transparent;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px #00f3ff;
        }

        .logs-title {
            text-align: left;
            font-size: 0.9rem;
            color: #ff0055;
            border-bottom: 1px dashed #ff0055;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .guestbook-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
        }

        .log-card {
            background: rgba(10, 10, 20, 0.8);
            border-left: 3px solid #00f3ff;
            padding: 10px 15px;
            border-radius: 0 5px 5px 0;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .log-user {
            color: #ff0055;
            font-weight: bold;
        }

        .log-time {
            color: #888;
            font-size: 0.75rem;
        }

        .log-msg {
            color: #ddd;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #00f3ff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: #ff0055;
            text-shadow: 0 0 8px #ff0055;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <span class="online">● SYSTEM ONLINE</span>
            <span class="robot">🤖</span>
        </div>

        <a href="../index.html" class="back-btn">← BACK TO SYSTEM MENU</a>

        <div class="profile">
            <p class="userid">MODULE_05 : GUESTBOOK</p>
            <h1>TRANSMISSION LOGS</h1>
            <p class="description">
                Tinggalkan pesan Anda di bawah ini untuk terekam dalam sistem robot.
            </p>
        </div>

        <!-- FORM BUKU TAMU -->
        <form id="guestbook-form" class="guestbook-form">
            <div class="input-group">
                <label for="username">> NAMA</label>
                <input type="text" id="username" placeholder="Masukkan nama kamu..." required>
            </div>
            <div class="input-group">
                <label for="message">> PESAN </label>
                <textarea id="message" rows="3" placeholder="Tulis pesan/kesan untuk Fauzan..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">KIRIM PESAN ()</button>
        </form>

        <!-- DAFTAR PESAN -->
        <div class="logs-title">> PESAN DARI PENGUNJUNG</div>
        <div class="guestbook-list" id="guestbook-list"></div>

        <!-- FOOTER -->
        <footer>
            <span>◉</span> FAUZAN ROBOT SYSTEM <span>//</span> TJKT <span>◉</span>
        </footer>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEkK4qbHIEmjIYb9xNH-NsMvoiOLPwlYeHC6hp9VeBgYgIiTZ5qRdc-h5mIaFT9UXczA/exec";

        const form = document.getElementById('guestbook-form');
        const list = document.getElementById('guestbook-list');

        document.addEventListener('DOMContentLoaded', loadMessages);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('username').value;
            const message = document.getElementById('message').value;
            const time = new Date().toLocaleDateString('id-ID') + ' | ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newEntry = { name, message, time };

            // Tampilkan di tampilan langsung
            addMessageToDOM(newEntry);
            form.reset();

            // Format data dikirim sebagai Form URL Encoded untuk menghindari isu CORS
            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('message', message);
            formData.append('time', time);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData
            })
            .then(() => {
                console.log('Data berhasil terkirim ke Google Sheets');
            })
            .catch(error => {
                console.error('Gagal mengirim data:', error);
            });
        });

        function addMessageToDOM(entry) {
            const card = document.createElement('div');
            card.className = 'log-card';
            card.innerHTML = `
                <div class="log-header">
                    <span class="log-user">🤖 ${escapeHTML(entry.name)}</span>
                    <span class="log-time">${entry.time}</span>
                </div>
                <div class="log-msg">${escapeHTML(entry.message)}</div>
            `;
            list.prepend(card);
        }

        function loadMessages() {
            list.innerHTML = '<div style="color: #00f3ff; font-size: 0.8rem;">LOADING_TRANSMISSIONS...</div>';
            
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    list.innerHTML = '';
                    if (!data || data.length === 0) {
                        list.innerHTML = '<div style="color: #888; font-size: 0.8rem;">NO_TRANSMISSIONS_FOUND</div>';
                    } else {
                        data.reverse().forEach(msg => addMessageToDOM(msg));
                    }
                })
                .catch(error => {
                    list.innerHTML = '<div style="color: #ff0055; font-size: 0.8rem;">FAILED_TO_LOAD_DATA</div>';
                    console.error('Error:', error);
                });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
