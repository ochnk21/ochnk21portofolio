<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAUZAN | GUESTBOOK LOGS</title>
    <!-- Hubungkan ke file CSS utama yang berada di folder luar -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <span class="online">● SYSTEM ONLINE</span>
            <span class="robot">🤖</span>
        </div>

        <!-- TOMBOL KEMBALI KE MENU UTAMA -->
        <a href="index.html" class="back-btn">← BACK TO SYSTEM MENU</a>

        <div class="profile">
            <p class="userid">MODULE_05 : GUESTBOOK</p>
            <h1>TRANSMISSION LOGS</h1>
            <p class="description">
                Tinggalkan pesan Anda di bawah ini untuk terekam dalam sistem robot.
            </p>
        </div>

        <!-- FORM BUKU TAMU -->
        <form id="guestbook-form" class="guestbook-form">
            <div class="input-group">
                <label for="username">> NAMA</label>
                <input type="text" id="username" placeholder="Masukkan nama kamu..." required>
            </div>
            <div class="input-group">
                <label for="message">> PESAN </label>
                <textarea id="message" rows="3" placeholder="Tulis pesan/kesan untuk Fauzan..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">KIRIM PESAN (//)</button>
        </form>

        <!-- DAFTAR PESAN -->
        <div class="logs-title">> PESAN DARI PENGUNJUNG</div>
        <div class="guestbook-list" id="guestbook-list"></div>

        <!-- FOOTER -->
        <footer>
            <span>◉</span> FAUZAN ROBOT SYSTEM <span>//</span> TJKT <span>◉</span>
        </footer>
    </div>

    <script>
        // URL Web App dari Google Apps Script Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVQ4hfvEwaoMHs4PtPXbqKseToUdTxDQsQ0nP-rlXmxlmGRkhXvFNkA0UXkAFAIaHQOA/exec";

        const form = document.getElementById('guestbook-form');
        const list = document.getElementById('guestbook-list');

        document.addEventListener('DOMContentLoaded', loadMessages);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('username').value;
            const message = document.getElementById('message').value;
            
            // Format waktu regional Indonesia
            const time = new Date().toLocaleDateString('id-ID') + ' | ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newEntry = { name, message, time };

            // Langsung tampilkan di layar agar terasa instan bagi user
            addMessageToDOM(newEntry);
            form.reset();

            // Mengirim data menggunakan format URL Encoded untuk mengindari masalah CORS
            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('message', message);
            formData.append('time', time);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData
            })
            .then(() => {
                console.log('Data berhasil terkirim ke Google Sheets');
            })
            .catch(error => {
                console.error('Gagal mengirim data:', error);
            });
        });

        // Fungsi memasukkan kotak pesan ke dalam struktur HTML
        function addMessageToDOM(entry) {
            const card = document.createElement('div');
            card.className = 'log-card';
            card.innerHTML = `
                <div class="log-header">
                    <span class="log-user">🤖 ${escapeHTML(entry.name)}</span>
                    <span class="log-time">${entry.time}</span>
                </div>
                <div class="log-msg">${escapeHTML(entry.message)}</div>
            `;
            list.prepend(card);
        }

        // Fungsi mengambil data yang tersimpan dari Google Sheets saat halaman dibuka
        function loadMessages() {
            list.innerHTML = '<div style="color: #00eaff; font-size: 11px; letter-spacing: 1px;">LOADING_TRANSMISSIONS...</div>';
            
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    list.innerHTML = '';
                    if (!data || data.length === 0) {
                        list.innerHTML = '<div style="color: #547985; font-size: 11px; letter-spacing: 1px;">NO_TRANSMISSIONS_FOUND</div>';
                    } else {
                        // Membalik urutan data (reverse) agar pesan terbaru selalu muncul di paling atas
                        data.reverse().forEach(msg => addMessageToDOM(msg));
                    }
                })
                .catch(error => {
                    list.innerHTML = '<div style="color: #ff0055; font-size: 11px; letter-spacing: 1px;">FAILED_TO_LOAD_DATA</div>';
                    console.error('Error:', error);
                });
        }

        // PERBAIKAN DI SINI: Karakter petik tunggal telah diubah menjadi kode entitas desimal '&#39;'
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
